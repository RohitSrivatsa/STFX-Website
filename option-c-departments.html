<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Directory · Option C</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .banner{background:var(--navy);color:#fff;padding:40px 0 34px;border-bottom:4px solid var(--gold)}
  .banner h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,44px);margin:0 0 6px}
  .banner p{margin:0 0 20px;color:#c9d4e3}
  .top{display:flex;gap:10px;flex-wrap:wrap}
  .top .search{flex:2 1 280px}.top select{flex:1 1 180px}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding:30px 0}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  nav.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px;align-self:start;position:sticky;top:16px}
  @media (max-width:860px){nav.side{position:static}}
  .side h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:10px 10px 6px}
  .side button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
  .side button:hover{background:var(--bg)}
  .side button.on{background:var(--navy);color:#fff}
  .side button.fac{font-weight:700}
  .side button.dep{padding-left:22px;color:#334155}
  .side button.on{color:#fff}
  .side button span{font-size:12px;color:var(--muted)} .side button.on span{color:var(--gold)}
  .side details summary{list-style:none;cursor:pointer}
  .side details summary::-webkit-details-marker{display:none}
  .results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;color:var(--muted)}
  .results-head b{color:var(--ink)}
  .group h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:24px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .group h3 small{font-family:var(--sans);font-size:13px;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:center;display:flex;flex-direction:column;transition:.2s}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .card .photo{aspect-ratio:1/1}
  .card .b{padding:14px 14px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
  .card h4{margin:0;font-size:16px}
  .card p{margin:0;font-size:13px;color:var(--muted)}
  .card .btn{margin:12px auto 0;font-size:13px;padding:7px 16px}
</style>
</head>
<body>
<div class="mockbar">Option C · Browse by faculty &amp; department · sample data — <a href="index.html">see all options</a></div>
<header class="site"><div class="wrap"><a class="brand" href="index.html"><img class="logo-img" src="stfx-logo.png" alt="St. Francis Xavier University" width="172" height="62"></a><span class="site-title">Research Experts</span></div></header>

<section class="banner"><div class="wrap">
  <h1>Research Expertise</h1>
  <p>Browse our faculty by department, or search for a topic or course.</p>
  <div class="top">
    <label class="search"><span class="sr">Search</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="field" type="search" placeholder="Search name, keyword or course" style="width:100%"></label>
    <label><span class="sr">Course</span><select id="course" class="field"></select></label>
    <label><span class="sr">Sort by</span><select id="sort" class="field"></select></label>
  </div>
</div></section>

<main class="wrap layout">
  <nav class="side" id="side" aria-label="Departments"></nav>
  <div>
    <div class="results-head"><span id="count"></span><button class="linkbtn" onclick="S.reset()">Show everyone</button></div>
    <div id="groups"></div>
  </div>
</main>
<footer><div class="wrap">Option C mockup · placeholder content</div></footer>

<script src="shared.js"></script>
<script>
const S = {q:'',faculty:'',dept:'',course:'',area:'',sort:'az'};
function renderSide(){
  const base = filterExperts({...S,faculty:'',dept:''});
  const n = f => base.filter(f).length;
  let h = `<button class="fac ${!S.faculty&&!S.dept?'on':''}" data-f="" data-d="">All faculty <span>${base.length}</span></button><h2>Faculties</h2>`;
  for(const f of FACULTIES){
    h += `<button class="fac ${S.faculty===f&&!S.dept?'on':''}" data-f="${f}" data-d="">Faculty of ${f} <span>${n(e=>e.faculty===f)}</span></button>`;
    if(S.faculty===f) h += Object.keys(DEPTS).filter(d=>DEPTS[d][1]===f).sort()
      .map(d=>`<button class="dep ${S.dept===d?'on':''}" data-f="${f}" data-d="${d}">${d} <span>${n(e=>e.dept===d)}</span></button>`).join('');
  }
  document.getElementById('side').innerHTML = h;
}
function render(){
  renderSide();
  const list = sortExperts(filterExperts(S),S.sort,S.q);
  const where = S.dept || (S.faculty?'Faculty of '+S.faculty:'all departments');
  document.getElementById('count').innerHTML = `<b>${list.length}</b> experts in ${where}${S.q?` matching “${esc(S.q)}”`:''}`;
  // group by department unless sorting by something that isn't alphabetical
  const groupBy = ['az','za','dept','relevance'].includes(S.sort) && !S.q;
  const groups = {};
  list.forEach(e=>{const k = groupBy ? e.dept : 'Results'; (groups[k]??=[]).push(e)});
  const keys = Object.keys(groups).sort();
  document.getElementById('groups').innerHTML = list.length ? keys.map(k=>`<section class="group">
    <h3>${esc(k)} <small>${groups[k].length} ${groups[k].length===1?'expert':'experts'}</small></h3>
    <div class="cards">${groups[k].map(e=>`<article class="card">${photo(e)}<div class="b">
      <h4>${hl(e.name,S.q)}</h4><p>${e.rank}</p><p>${hl(e.keywords.slice(0,2).join(' · '),S.q)}</p>
      <a class="btn navy" href="${profileUrl(e,'option-c-departments.html')}">View profile</a></div></article>`).join('')}</div></section>`).join('')
    : `<div class="empty">No experts match. <button class="linkbtn" onclick="S.reset()">Show everyone</button></div>`;
}
bindControls(S,render);
document.getElementById('side').addEventListener('click',ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  S.faculty = b.dataset.f; S.dept = b.dataset.d; S.course=''; S.fill(); render();
});
render();
</script>
</body>
</html>
