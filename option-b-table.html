<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Directory · Option B</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .head{padding:36px 0 20px}
  .head h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,4vw,42px);margin:0 0 4px}
  .head p{margin:0;color:var(--muted)}
  .bar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
  @media (max-width:900px){.bar{grid-template-columns:1fr 1fr}.bar .search{grid-column:1/-1}}
  @media (max-width:480px){.bar{grid-template-columns:1fr}}
  .meta{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;font-size:14px;color:var(--muted)}
  .meta b{color:var(--ink)}
  table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:#fafbfc;padding:12px 16px;border-bottom:1px solid var(--line)}
  th button{all:unset;cursor:pointer}
  th button:hover{color:var(--navy)}
  th .ar{color:var(--gold)}
  td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfaf5}
  .who{display:flex;gap:12px;align-items:center}
  .who .photo{width:48px;height:48px;border-radius:50%;flex:none}
  .who a{font-weight:700;text-decoration:none;font-size:15px}
  .who a:hover{color:var(--navy-2);text-decoration:underline}
  .who small{display:block;color:var(--muted);font-size:12.5px}
  .tags span{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0}
  .code{font-weight:600;color:var(--navy-2);font-size:13px;white-space:nowrap}
  .go{white-space:nowrap;text-align:right}
  @media (max-width:820px){
    thead{display:none} table,tbody,tr,td{display:block}
    tr{border-bottom:1px solid var(--line);padding:6px 0}
    td{border:0;padding:6px 16px} td[data-l]::before{content:attr(data-l);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .go{text-align:left}
  }
</style>
</head>
<body>
<div class="mockbar">Option B · Simple directory table · sample data — <a href="index.html">see all options</a></div>
<header class="site"><div class="wrap"><a class="brand" href="index.html"><img class="logo-img" src="stfx-logo.png" alt="St. Francis Xavier University" width="172" height="62"></a><span class="site-title">Research Experts</span></div></header>

<main class="wrap">
  <div class="head"><h1>Research Experts</h1><p>Search StFX faculty by name, keyword, department or course.</p></div>
  <div class="bar">
    <label class="search"><span class="sr">Search</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" class="field" type="search" placeholder="Name, keyword or course code"></label>
    <label><span class="sr">Faculty</span><select id="faculty" class="field" style="width:100%"></select></label>
    <label><span class="sr">Department</span><select id="dept" class="field" style="width:100%"></select></label>
    <label><span class="sr">Course</span><select id="course" class="field" style="width:100%"></select></label>
    <label><span class="sr">Sort by</span><select id="sort" class="field" style="width:100%"></select></label>
  </div>
  <div class="meta"><span id="count"></span><button class="linkbtn" onclick="S.reset()">Reset</button></div>
  <table>
    <thead><tr>
      <th><button data-s="az">Name <span class="ar" id="ar-name"></span></button></th>
      <th><button data-s="dept">Department <span class="ar" id="ar-dept"></span></button></th>
      <th>Research keywords</th><th>Courses</th><th></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<footer><div class="wrap">Option B mockup · placeholder content</div></footer>

<script src="shared.js"></script>
<script>
const S = {q:'',faculty:'',dept:'',course:'',area:'',sort:'az'};
function render(){
  const list = sortExperts(filterExperts(S),S.sort,S.q);
  document.getElementById('count').innerHTML = `Showing <b>${list.length}</b> of ${EXPERTS.length} experts`;
  document.getElementById('ar-name').textContent = S.sort==='az'?'↑':S.sort==='za'?'↓':'';
  document.getElementById('ar-dept').textContent = S.sort==='dept'?'↑':'';
  document.getElementById('rows').innerHTML = list.length ? list.map(e=>`<tr>
    <td><div class="who">${photo(e)}<div><a href="${profileUrl(e,'option-b-table.html')}">${hl(e.name,S.q)}</a><small>${e.rank}</small></div></div></td>
    <td data-l="Department">${hl(e.dept,S.q)}<br><small style="color:var(--muted)">Faculty of ${e.faculty}</small></td>
    <td data-l="Keywords" class="tags">${e.keywords.map(k=>`<span>${hl(k,S.q)}</span>`).join('')}</td>
    <td data-l="Courses">${e.courses.map(c=>`<div class="code">${hl(c.code,S.q)}</div>`).join('')}</td>
    <td class="go"><a class="btn line" href="${profileUrl(e,'option-b-table.html')}">View profile →</a></td></tr>`).join('')
    : `<tr><td colspan="5"><div class="empty">No experts match. Try another keyword or clear filters.</div></td></tr>`;
}
bindControls(S,render);
document.querySelectorAll('th button').forEach(b=>b.onclick=()=>{
  S.sort = b.dataset.s==='az' ? (S.sort==='az'?'za':'az') : 'dept'; S.fill(); render();
});
render();
</script>
</body>
</html>
